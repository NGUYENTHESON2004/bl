<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #FFFFFF;
    overflow: hidden;
  }

  /* Khung chứa tự động căn giữa */
  #animation_container {
    position: absolute; 
    margin: auto; 
    left: 0; right: 0; top: 0; bottom: 0;
    background-color: rgba(255, 255, 255, 1.00);
  }
  
  canvas {
    display: block;
    touch-action: none;
    background-color: rgba(255, 255, 255, 1.00);
    /* 🚀 Bổ sung 2 dòng dưới để chống chớp nháy khi chạm */
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  
  /* ========================================= */
  /* HIỆU ỨNG MÀN HÌNH LOADING CHUYÊN NGHIỆP   */
  /* ========================================= */
  #loading-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #1a1a1a; color: #00E5FF;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999999; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.4s ease; /* Hiệu ứng mờ dần khi tắt */
  }
  .loader-ring {
      width: 60px; height: 60px;
      border: 5px solid rgba(0, 229, 255, 0.2);
      border-top: 5px solid #00E5FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .loader-text { 
      font-size: 18px; font-weight: bold; letter-spacing: 1px; 
      margin-bottom: 15px; color: #ffffff; 
  }
  .loader-bar-bg { 
      width: 250px; height: 8px; background: #333; 
      border-radius: 4px; overflow: hidden; 
  }
  .loader-bar-fill { 
      height: 100%; width: 0%; background: #00E5FF; 
      transition: width 0.1s linear; 
  }

  /* LỚP PHỦ YÊU CẦU CHẠM (Ẩn đi lúc đầu, chỉ hiện khi load 100%) */
  #fullscreen-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.9); color: white;
      display: none; /* Khởi tạo ở trạng thái ẨN */
      flex-direction: column; justify-content: center; align-items: center;
      z-index: 999999; font-family: sans-serif;
  }
  #start-btn {
      padding: 15px 40px; font-size: 20px; font-weight: bold;
      background-color: #00E5FF; color: #000; border: none;
      border-radius: 10px; margin-top: 20px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
  }

<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="RECOVER_BL_IAK_13010_HTML5 Canvas.js?1785656611662"></script>
<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
function init() {
    canvas = document.getElementById("canvas");
    anim_container = document.getElementById("animation_container");
    dom_overlay_container = document.getElementById("dom_overlay_container");
    var comp=AdobeAn.getComposition("30B89A14D6F24545AF223DEE9726834E");
    var lib=comp.getLibrary();
    var loader = new createjs.LoadQueue(false);
    loader.installPlugin(createjs.Sound);
    
    // BẮT SỰ KIỆN ĐANG TẢI DỮ LIỆU (%)
    loader.addEventListener("progress", function(evt) {
        var percent = Math.round(evt.loaded * 100);
        document.getElementById("load-percent").innerText = "ĐANG TẢI DỮ LIỆU... " + percent + "%";
        document.getElementById("load-bar").style.width = percent + "%";
    });

    loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
    loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
    var lib=comp.getLibrary();
    loader.loadManifest(lib.properties.manifest);
}
function handleFileLoad(evt, comp) {
    var images=comp.getImages();    
    if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }    
}
function handleComplete(evt,comp) {
    var lib=comp.getLibrary();
    var ss=comp.getSpriteSheet();
    var queue = evt.target;
    var ssMetadata = lib.ssMetadata;
    for(i=0; i<ssMetadata.length; i++) {
        ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
    }
    exportRoot = new lib.RECOVER_BL_IAK_13010_HTML5Canvas();
    stage = new lib.Stage(canvas);
    stage.enableMouseOver(); 
    
    // BẬT CẢM ỨNG (Tối ưu chặn cuộn trang)
    if(createjs.Touch.isSupported()) {
        createjs.Touch.enable(stage, true, false); 
    }

    fnStartAnimation = function() {
        stage.addChild(exportRoot);
        
        // 🚀 KÍCH HOẠT GPU RENDER (Cực kỳ quan trọng để chống giật trên Mobile)
        createjs.Ticker.timingMode = createjs.Ticker.RAF_SYNCHED; 
        createjs.Ticker.framerate = lib.properties.fps;
        
        createjs.Ticker.addEventListener("tick", stage);
    }

    // Ép giao diện bám sát lề ngang màn hình
    AdobeAn.makeResponsive(true,'width',true,1,[canvas,anim_container,dom_overlay_container]);   
    AdobeAn.compositionLoaded(lib.properties.id);
    fnStartAnimation();
    autoExpandSmallButtons(exportRoot);
    
    // XỬ LÝ KHI TẢI XONG 100%: Ẩn Loading, Hiện nút "Chạm để bắt đầu"
    setTimeout(function() {
        var loadScreen = document.getElementById("loading-screen");
        loadScreen.style.opacity = "0"; // Mờ dần
        setTimeout(function() {
            loadScreen.style.display = "none"; // Ẩn hẳn
            document.getElementById("fullscreen-overlay").style.display = "flex"; // Hiện nút
        }, 400); // Đợi 0.4s cho hiệu ứng mờ kết thúc
    }, 200);
}
function autoExpandSmallButtons(rootContainer) {
    // 1. ĐO ĐẠC TỶ LỆ CO NGÓT
    var canvasEl = document.getElementById("canvas");
    var scaleRatio = 1;
    if (canvasEl && canvasEl.clientWidth > 0) {
        scaleRatio = canvasEl.width / canvasEl.clientWidth; 
    }

    var MIN_SAFE_SIZE = 70 * scaleRatio; 
    var PADDING = 25 * scaleRatio;       

    function scanNode(node) {
        if (!node || !node.visible) return;

        var hasValidName = (node.name && typeof node.name === "string" && node.name.indexOf("instance") !== 0);
        var hasEventOrPointer = (node.cursor === "pointer" || node.hasEventListener("mousedown") || node.hasEventListener("click"));

        // 🚀 BẢO VỆ CHỐNG LẶP: Đảm bảo chưa từng được bọc khiên (!node.__hasShield)
        if ((hasValidName || hasEventOrPointer) && node.addChildAt && !node.__hasShield) {
            
            // 🚀 BÍ KÍP TRỊ ĐƠ MÁY NẰM Ở ĐÂY: LUÔN DÙNG nominalBounds TRƯỚC!
            // Dữ liệu này được Animate đo sẵn, lấy ra dùng ngay mà không tốn CPU.
            var b = node.nominalBounds; 
            
            // Chỉ khi nào Animate không cấp sẵn, ta mới cắn răng dùng getBounds()
            if (!b) {
                b = node.getBounds();
            }

            if (b && b.width > 0) {
                var hitBox = new createjs.Shape();
                
                var hitW = b.width + PADDING * 2;
                var hitH = b.height + PADDING * 2;
                
                var finalW = Math.max(hitW, MIN_SAFE_SIZE);
                var finalH = Math.max(hitH, MIN_SAFE_SIZE);

                var hitX = b.x - (finalW - b.width) / 2;
                var hitY = b.y - (finalH - b.height) / 2;

                // Vẽ lớp áo giáp 
                hitBox.graphics.beginFill("#000000").drawRect(hitX, hitY, finalW, finalH);
                
                hitBox.alpha = 0.01; 
                hitBox.name = "invisible_shield"; 
                
                node.addChildAt(hitBox, 0); 
                node.cursor = "pointer"; 
                
                // 🚀 ĐÁNH DẤU LẠI: Nút này đã có giáp, sau này quét lại cấm không được thêm nữa
                node.__hasShield = true;
            }
        }

        // Lặp ngược đệ quy an toàn
        if (node.children && node.numChildren > 0) {
            for (var i = node.numChildren - 1; i >= 0; i--) {
                var child = node.getChildAt(i);
                if (child.name !== "invisible_shield") { 
                    scanNode(child);
                }
            }
        }
    }

    scanNode(rootContainer);
}
function playSound(id, loop, offset) {
    return createjs.Sound.play(id, {'interrupt':createjs.Sound.INTERRUPT_EARLY, 'loop': loop, 'offset': offset});}
</script>
</head>
<body onload="init();">

    <!-- MÀN HÌNH LOADING CHUYÊN NGHIỆP -->
    <div id="loading-screen">
        <div class="loader-ring"></div>
        <div id="load-percent" class="loader-text">ĐANG TẢI DỮ LIỆU... 0%</div>
        <div class="loader-bar-bg">
            <div id="load-bar" class="loader-bar-fill"></div>
        </div>
    </div>

    <!-- LỚP PHỦ YÊU CẦU CHẠM ĐỂ BẮT ĐẦU -->
    <div id="fullscreen-overlay">
        <h2>Vui lòng xoay ngang thiết bị</h2>
        <button id="start-btn">CHẠM ĐỂ BẮT ĐẦU</button>
    </div>

    <!-- Khung chứa giao diện phần mềm -->
    <div id="animation_container" style="width:1420px; height:720px">
        <canvas id="canvas" width="1420" height="720"></canvas>
        <div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:1420px; height:720px; position: absolute; left: 0px; top: 0px; display: block;">
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ KHÓA QUAY NGANG, ẨN MÀN CHỜ VÀ MỞ KHÓA ÂM THANH -->
    <!-- SCRIPT XỬ LÝ KHÓA QUAY NGANG, ẨN MÀN CHỜ VÀ MỞ KHÓA ÂM THANH -->
    <!-- SCRIPT XỬ LÝ KHÓA QUAY NGANG, ẨN MÀN CHỜ VÀ MỞ KHÓA ÂM THANH -->
    <script>
        var overlay = document.getElementById('fullscreen-overlay');
        var startBtn = document.getElementById('start-btn');
        
        function batDauHoc(e) {
            e.preventDefault(); 
            var docElm = document.documentElement;
            
            // 1. Kích hoạt Fullscreen
            try {
                if (docElm.requestFullscreen) docElm.requestFullscreen();
                else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
            } catch(err) {}
            
            // 2. Khóa xoay màn hình ngang
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {});
                }
            } catch(err) {}

            // 3. CHIẾN THUẬT "SILENT LOOP" (NHẠC NỀN ẢO) ĐỂ GIỮ KÊNH ÂM THANH MỞ VĨNH VIỄN
            try {
                var AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    // Lấy lõi Audio của phần mềm
                    var ctx = (createjs.WebAudioPlugin && createjs.WebAudioPlugin.context) 
                              ? createjs.WebAudioPlugin.context 
                              : new AudioContext();
                    
                    if (ctx.state === 'suspended') ctx.resume();

                    // Tự động tạo một sóng âm thanh (Oscillator) chạy nền
                    var oscillator = ctx.createOscillator();
                    var gainNode = ctx.createGain();
                    
                    // Ép âm lượng về 0 (Im lặng tuyệt đối, không gây tiếng xèo xèo)
                    gainNode.gain.value = 0; 
                    
                    // Nối sóng âm vào màng loa thiết bị
                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    
                    // Cho phát liên tục không ngừng nghỉ
                    oscillator.start(0);

                    // LỚP BẢO VỆ SỐ 2: 
                    // Cứ mỗi lần học viên chạm tay vào BẤT KỲ ĐÂU trên màn hình, ép tỉnh dậy nếu bị OS ép ngủ
                    document.addEventListener('touchstart', function() {
                        if (ctx.state === 'suspended') ctx.resume();
                    }, {passive: true});
                }
            } catch(err) {
                console.warn("Lỗi bẻ khóa âm thanh: ", err);
            }
            
            // 4. Ẩn màn hình chờ
            overlay.style.display = 'none';
        }

        // Bắt sự kiện TOUCHSTART (Nhạy nhất trên iOS) và CLICK (Cho máy tính/Android)
        startBtn.addEventListener('touchstart', batDauHoc, {passive: false});
        startBtn.addEventListener('click', batDauHoc);
    </script>
</body>
