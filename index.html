<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="authoring-tool" content="Adobe_Animate_CC">
<title>RECOVER_BL_IAK_13010_HTML5 Canvas</title>

<!-- TỐI ƯU HÓA HIỂN THỊ ĐIỆN THOẠI -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<style>
  #animation_container {
    position:absolute; margin:auto; left:0;right:0; top:0;bottom:0;
  }
  
  /* LỚP PHỦ YÊU CẦU CHẠM */
  #fullscreen-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.9); color: white;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 999999; font-family: sans-serif;
  }
  #start-btn {
      padding: 15px 40px; font-size: 20px; font-weight: bold;
      background-color: #00E5FF; color: #000; border: none;
      border-radius: 10px; margin-top: 20px; cursor: pointer;
  }
</style>

<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="RECOVER_BL_IAK_13010_HTML5 Canvas.js?1785656611662"></script>
<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
function init() {
    canvas = document.getElementById("canvas");
    anim_container = document.getElementById("animation_container");
    dom_overlay_container = document.getElementById("dom_overlay_container");
    var comp=AdobeAn.getComposition("30B89A14D6F24545AF223DEE9726834E");
    var lib=comp.getLibrary();
    var loader = new createjs.LoadQueue(false);
    loader.installPlugin(createjs.Sound);
    loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
    loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
    var lib=comp.getLibrary();
    loader.loadManifest(lib.properties.manifest);
}
function handleFileLoad(evt, comp) {
    var images=comp.getImages();    
    if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }    
}
function handleComplete(evt,comp) {
    var lib=comp.getLibrary();
    var ss=comp.getSpriteSheet();
    var queue = evt.target;
    var ssMetadata = lib.ssMetadata;
    for(i=0; i<ssMetadata.length; i++) {
        ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
    }
    exportRoot = new lib.RECOVER_BL_IAK_13010_HTML5Canvas();
    stage = new lib.Stage(canvas);
    stage.enableMouseOver(); 
    
    // BẬT CẢM ỨNG (KHÔNG CHẶN CLICK CHUỘT)
    if(createjs.Touch.isSupported()) {
        createjs.Touch.enable(stage, false, true); 
    }

    fnStartAnimation = function() {
        stage.addChild(exportRoot);
        createjs.Ticker.framerate = lib.properties.fps;
        createjs.Ticker.addEventListener("tick", stage);
    }       
    AdobeAn.makeResponsive(true,'both',true,1,[canvas,anim_container,dom_overlay_container]);   
    AdobeAn.compositionLoaded(lib.properties.id);
    fnStartAnimation();
}
function playSound(id, loop, offset) {
    return createjs.Sound.play(id, {'interrupt':createjs.Sound.INTERRUPT_EARLY, 'loop': loop, 'offset': offset});}
</script>
</head>
<body onload="init();" style="margin:0px;">

    <!-- LỚP PHỦ YÊU CẦU CHẠM ĐỂ BẮT ĐẦU -->
    <div id="fullscreen-overlay">
        <h2>Vui lòng xoay ngang thiết bị</h2>
        <button id="start-btn">CHẠM ĐỂ BẮT ĐẦU</button>
    </div>

    <div id="animation_container" style="background-color:rgba(255, 255, 255, 1.00); width:1420px; height:720px">
        <canvas id="canvas" width="1420" height="720" style="position: absolute; display: block; background-color:rgba(255, 255, 255, 1.00); touch-action: none;"></canvas>
        <div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:1420px; height:720px; position: absolute; left: 0px; top: 0px; display: block;">
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ KHÓA QUAY NGANG VÀ ẨN MÀN CHỜ -->
    <script>
        var overlay = document.getElementById('fullscreen-overlay');
        var startBtn = document.getElementById('start-btn');
        
        function batDauHoc(e) {
            e.stopPropagation(); 
            var docElm = document.documentElement;
            
            try {
                if (docElm.requestFullscreen) docElm.requestFullscreen();
                else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
            } catch(err) {}
            
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {});
                }
            } catch(err) {}
            
            overlay.style.display = 'none';
        }

        startBtn.addEventListener('click', batDauHoc);
    </script>
</body>
</html>
